name: ${PARSE_PROJECT:-parse-server-mongo}
services:
  mongo:
    image: mongo:7
    container_name: ${PARSE_MONGO_CONTAINER:-parse-server-mongo-mongo}
    networks:
      parse-net:
        ipv4_address: ${PARSE_MONGO_IP:-172.30.0.10}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  parse-server:
    build:
      context: .
    image: ${PARSE_IMAGE:-parse-server-mongo:local}
    container_name: ${PARSE_APP_CONTAINER:-parse-server-mongo-app}
    networks:
      parse-net:
        ipv4_address: ${PARSE_APP_IP:-172.30.0.11}
    depends_on:
      mongo:
        condition: service_healthy
    # Published on the host's 127.0.0.1 only, never on another host interface:
    # no other host can reach the app at all. An allowlist alone cannot keep
    # them out: where docker relays a published port's connections, as it
    # does for IPv6 on this IPv4-only network, they arrive from this network's
    # gateway, an address in the subnet below. 127.0.0.1 alone, and not [::1]
    # too: publishing on [::1] fails `docker compose up` on a host with IPv6
    # off. So call the app at 127.0.0.1: nothing listens on [::1], where a
    # client may try `localhost` first.
    ports:
      - "127.0.0.1:${PARSE_HOST_PORT:-6100}:${PARSE_CONTAINER_PORT:-6100}"
    environment:
      PORT: "${PARSE_CONTAINER_PORT:-6100}"
      PARSE_MOUNT: "${PARSE_MOUNT_PATH:-/parse}"
      PARSE_SERVER_APPLICATION_ID: ${PARSE_APP_ID:-keploy-parse-app}
      PARSE_SERVER_MASTER_KEY: ${PARSE_MASTER_KEY:-keploy-parse-master}
      # Loopback and this network's subnet: a client on the docker host calls
      # through the 127.0.0.1-published port above and arrives from this
      # network's gateway. See masterKeyIps in index.js. Never `0.0.0.0/0` or
      # `::/0`: that admits every address, not only the ones the host's own
      # calls arrive from.
      PARSE_SERVER_MASTER_KEY_IPS: ${PARSE_MASTER_KEY_IPS:-127.0.0.1,::1,${PARSE_NETWORK_SUBNET:-172.30.0.0/24}}
      PARSE_SERVER_SERVER_URL: ${PARSE_SERVER_URL:-http://localhost:6100/parse}
      PARSE_SERVER_DATABASE_URI: ${PARSE_DATABASE_URI:-mongodb://172.30.0.10:27017/parse}
      PARSE_SERVER_ALLOW_CUSTOM_OBJECT_ID: "${PARSE_ALLOW_CUSTOM_OBJECT_ID:-1}"

networks:
  parse-net:
    name: ${PARSE_NETWORK_NAME:-parse-server-mongo-net}
    driver: bridge
    ipam:
      config:
        - subnet: ${PARSE_NETWORK_SUBNET:-172.30.0.0/24}
